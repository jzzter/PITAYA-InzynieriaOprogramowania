{% extends 'base.html' %}
{% block content %}
<div class="card">
    <h2>{{ oferta.nazwa }}</h2>
    <p><strong>Lokacja:</strong> {{ oferta.lokacja }}</p>
    <p><strong>Długość pobytu:</strong> {{ oferta.iloscDni }} dni ({{ oferta.iloscNocy }} nocy)</p>
    <p>{{ oferta.opis }}</p>
    <h3 style="color: #e55039;">Cena: {{ oferta.cena }} PLN / osobę</h3>
    <a href="/rezerwuj/{{ oferta.idOferty }}" class="btn">Zarezerwuj teraz</a>
</div>
{% endblock %}
